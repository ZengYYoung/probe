name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (JDK, Maven, Graphviz)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jdk maven graphviz

      - name: Install probe
        run: pip install -e ".[dev]"

      - name: Run unit tests (mock, no network, no key)
        run: pytest -q -m 'not integration'

  build-image:
    name: build-image
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t probe:ci .
