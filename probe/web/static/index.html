<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Probe WebUI</title>
  <script src="https://unpkg.com/cytoscape"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem; }
    #cy { width: 100%; height: 60vh; border: 1px solid #ccc; }
    textarea { width: 100%; height: 12vh; font-family: monospace; }
    button { margin: 0.25rem 0; }
  </style>
</head>
<body>
  <h1>Probe WebUI</h1>

  <section>
    <h2>Submit task</h2>
    <input id="goal" placeholder="goal" style="width:60%" />
    <input id="repo" placeholder="target_repo path" style="width:60%" />
    <button id="submit">Submit</button>
    <pre id="tid"></pre>
  </section>

  <section>
    <h2>Code map (package)</h2>
    <button id="load-map">Load package.dot</button>
    <textarea id="dot" readonly></textarea>
    <div id="cy"></div>
  </section>

  <script>
    // Minimal SPA: submit a task and load the package DOT for cytoscape.
    async function submitTask() {
      const goal = document.getElementById("goal").value;
      const target_repo = document.getElementById("repo").value;
      const r = await fetch("/tasks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ goal, target_repo }),
      });
      const j = await r.json();
      document.getElementById("tid").textContent = "task_id: " + j.task_id;
    }

    async function loadMap() {
      const repo = document.getElementById("repo").value;
      const r = await fetch("/map/package.dot?repo=" + encodeURIComponent(repo));
      const dot = await r.text();
      document.getElementById("dot").value = dot;
      // Cytoscape rendering is left as a future enhancement; the DOT text
      // is surfaced for inspection. A real renderer would parse `dot` here.
    }

    document.getElementById("submit").addEventListener("click", submitTask);
    document.getElementById("load-map").addEventListener("click", loadMap);
  </script>
</body>
</html>
