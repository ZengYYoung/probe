image: python:3.12-slim-bookworm
stages: [test, build]
unit-test:
  stage: test
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends default-jdk-headless maven graphviz && rm -rf /var/lib/apt/lists/*
  script:
    - pip install -e ".[dev]"
    - pytest -q -m 'not integration'
build-image:
  stage: build
  image: docker:24
  services: [docker:24-dind]
  script:
    - docker build -t probe:ci .
